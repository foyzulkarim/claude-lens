name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Non-blocking smoke check — does not gate merges (see plan #P1-3/#P1-4).
      - run: npm run build-storybook
        continue-on-error: true
